artifacts = ["/app/answers.json"]

[task]
name = "dynamo/reconstruct-command-network"
description = "Rebuild a seized command network's directive ledger from a packed evidence container whose block index was wiped and fixed-size blocks shuffled, then answer recursive command-closure link-analysis queries over the reconstructed graph"

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Security"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Digital Forensics"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
task_objective = ["implement", "analyze"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 6
difficulty_explanation = "The directive graph is not given as readable text: it is packed into a binary evidence container (network.pack) whose block index was wiped and whose fixed-size data blocks were then shuffled, so stored order carries no information. Each cell's ledger -- its alias, its command threshold, and its inbound directives -- survives in the pool, and catalog.json pins each ledger's reconstruction uniquely by exact byte length, SHA-256, and the pool index of its first (head) block, but no block carries an identifier, a length, or a pointer to the block that follows it. The blocks of a ledger are the fragments of a raw DEFLATE stream, and the pool also contains non-zero decoy blocks belonging to no ledger (about 1.5x the real fragment count), so the set of non-empty blocks is strictly larger than the ledgers require and cannot be partitioned by counting. The container format is deliberately not disclosed in instruction.md; a solver must discover that the surviving blocks reconstitute each ledger through an inflate-validated reassembly search, keyed only by the catalog length and the digest of the *decompressed* content, so reading the pool at face value or in stored order recovers nothing and every graph-derived answer collapses -- while finishing quickly rather than hanging. Once the ledgers are recovered the analysis bites a second time: command is a fixed-point accumulation, where an entity commands a cell once the directives it and the cells it already commands send into that cell reach the cell's threshold. The network is authored so that most cells sit above any single inbound edge but at or below the threshold reachable through a commanded intermediary, so a solver that computes command from direct edges only -- the natural first reading -- gets the majority of the commanders/commands/apex queries wrong (measured: a direct-only closure is wrong on 52% of all graded queries, 75% of the closure queries), even though it recovers the ledgers correctly. The scale (34 entities, 22 packed ledgers across 160 shuffled blocks, 80 queries) puts the graph well beyond hand tracing. The network is synthetic, author-generated with the disclosed generator but structurally realistic. In the real world this is the daily work of a digital-forensics examiner performing link analysis on recovered evidence -- reconstructing a communications or transaction ledger off a corrupted container and then establishing who effectively directs whom through layered intermediaries, which is exactly the deliverable such an examiner produces."
solution_explanation = "Parse network.pack: a header (4-byte magic 'RLNK', 1-byte version, uint16 block_size, uint32 block_count) followed by block_count fixed-size blocks laid back-to-back and shuffled. For each catalog record, start at its head block and run a depth-first reassembly that appends candidate blocks one at a time, feeding each newly appended block to a running raw-inflate decompressor (zlib.decompressobj(-15)); prune any candidate that makes the inflater raise (a wrong continuation block, real or decoy, almost always does). Accept an ordering when the decompressor reaches end-of-stream and the inflated bytes have the catalog length and SHA-256. Each recovered ledger is a JSON object {\"alias\": string|null, \"tau\": int, \"in\": [[from_id, weight_int], ...]}. Build the directive graph from every ledger's inbound weights, then compute command as a bottom-up fixed-point closure over all entities: repeatedly add 'A commands C' whenever the weight into C from A plus the weight into C from every cell A already commands is at least C's tau, until an iteration adds nothing new -- this handles multi-level chains without recursion and reaches the unique least fixpoint. Answer the five query types directly from the recovered ledgers and the closure (commanders/commands/apex as sorted id lists), and write the result as a single JSON object to /app/answers.json. The reference solution/solve.py recovers all 22 ledgers and answers every query in about half a second. All weights and thresholds are integers, so every answer is exact with no tolerance."
verification_explanation = "The agent writes a single declared artifact, /app/answers.json, mapping every query_id in /app/data/queries.jsonl to its answer. Structure tests validate: the file is a JSON object and a real regular file (not a symlink, and not aliasing the expected-digests file); it covers exactly the graded query_id set with no missing or extra keys; directives answers are integers or null, alias answers are strings or null, and commanders/commands/apex answers are sorted, duplicate-free JSON arrays of ids. A guard test asserts the baked ground truth is non-degenerate and covers every one of the five query types. Correctness is checked by a parametrized test with one case per query group (grouped by type, up to 20 queries each): each group's answers are canonicalized (arrays sorted, compact separators) and hashed with SHA-256, and the digest is compared against a value in tests/expected.json computed once from the reference resolution in solution/solve.py. No numeric tolerance is used or needed -- every weight and threshold is an integer, so any correct implementation lands on the identical value, and every graded answer has a single determinate correct value under instruction.md's rules. Grouping up to 20 queries per digest keeps individual answers practically unrecoverable from the hash (well over 2^45 joint values per group given the set-valued and string answer spaces) while still reporting failures at per-group granularity. pytest is pinned with --rootdir=/tests --confcutdir=/tests --noconftest -p no:cacheprovider so a conftest or cache planted anywhere under /app cannot influence the verdict. The verifier reads only the declared artifact, the already agent-visible queries.jsonl, and tests/expected.json; it recomputes nothing from network.pack at verify time and installs nothing. Ground truth (the pre-pack graph) exists only in the seeded generator and in the tests/ digests, never in the agent image. Doing nothing leaves no answers.json and fails every test; the reference solution computes every answer from /app/data and passes all of them."

